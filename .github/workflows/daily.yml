name: daily indie trending

on:
  schedule:
    # 매일 20:17 UTC = 다음 날 05:17 KST. GitHub 예약이 최대 3시간쯤 밀리는 것이 관측되어(10-27 09:50 KST 실행) 그만큼 앞당겨 두었습니다. 끝나면 미디어 리포트가 이어서 돕니다.
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "수집 날짜 (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false
      force:
        description: "같은 날짜 스냅샷이 있어도 다시 수집"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 날짜 결정
        id: d
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집
        run: python3 collect.py --date "${{ steps.d.outputs.date }}" ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: 리포트 생성
        run: python3 report.py --date "${{ steps.d.outputs.date }}"

      - name: 한글 폰트 설치 (카드 이미지용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 카드 생성
        run: python3 cards.py --date "${{ steps.d.outputs.date }}"

      - name: 개인 리포트 생성
        run: python3 personal.py --date "${{ steps.d.outputs.date }}" --no-send

      - name: 스냅샷·리포트 커밋
        run: |
          git config user.name "indie-trending-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "snapshot ${{ steps.d.outputs.date }}"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push

      - name: Discord 전송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 notify.py --date "${{ steps.d.outputs.date }}"

      - name: 개인 리포트 전송
        env:
          DISCORD_WEBHOOK_URL_PERSONAL: ${{ secrets.DISCORD_WEBHOOK_URL_PERSONAL }}
        run: python3 personal.py --date "${{ steps.d.outputs.date }}" --send-only
