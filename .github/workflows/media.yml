name: daily media trends

on:
  schedule:
    # 매일 00:30 UTC = 09:30 KST. 게임 리포트(daily.yml, 00:05 UTC) 뒤에 돕니다.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "수집 날짜 (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false

permissions:
  contents: write

# 게임 리포트·주간 리포트와 같은 그룹: 겹치면 순서대로 돕니다.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 날짜 결정
        id: d
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집
        run: python3 media.py collect --date "${{ steps.d.outputs.date }}"

      - name: 리포트 생성
        run: python3 media.py report --date "${{ steps.d.outputs.date }}"

      - name: 한글 폰트 설치 (카드 이미지용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 카드 생성
        run: python3 media.py cards --date "${{ steps.d.outputs.date }}"

      - name: 스냅샷·리포트 커밋
        run: |
          git config user.name "indie-trending-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "media snapshot ${{ steps.d.outputs.date }}"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push

      - name: Discord 전송 (개인 채널 전용)
        env:
          DISCORD_WEBHOOK_URL_MEDIA: ${{ secrets.DISCORD_WEBHOOK_URL_MEDIA }}
          DISCORD_WEBHOOK_URL_PERSONAL: ${{ secrets.DISCORD_WEBHOOK_URL_PERSONAL }}
        run: python3 media.py send --date "${{ steps.d.outputs.date }}"
