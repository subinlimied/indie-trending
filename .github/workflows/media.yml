name: daily media trends

on:
  # 자체 예약 대신, 게임 리포트(daily indie trending)가 끝나면 바로 이어서 돕니다.
  # GitHub 예약이 몇 시간씩 밀려도 두 리포트가 같은 순서로 나가고, 밈 설명 예약 작업이 기다리는 시간이 줄어듭니다.
  workflow_run:
    workflows: ["daily indie trending"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "수집 날짜 (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false
      force:
        description: "같은 날짜 스냅샷이 있어도 다시 수집"
        type: boolean
        default: false

permissions:
  contents: write

# 게임 리포트·주간 리포트와 같은 그룹: 겹치면 순서대로 돕니다.
concurrency:
  group: media
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 날짜 결정
        id: d
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # 없으면 유튜브 쇼츠 섹션만 건너뜁니다
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}   # 없으면 Threads 키워드 섹션만 건너뜁니다 (README "Threads 토큰 만드는 법")
          REPO_SECRETS_PAT: ${{ secrets.REPO_SECRETS_PAT }}   # 선택: Secrets 쓰기 권한 PAT. 있으면 갱신한 Threads 토큰을 gh secret set 으로 저장
        run: python3 media.py collect --date "${{ steps.d.outputs.date }}" ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: 리포트 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 없으면 한국어 밈 설명·인사이트만 빠집니다
        run: python3 media.py report --date "${{ steps.d.outputs.date }}"

      - name: 한글 폰트 설치 (카드 이미지용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 카드 생성
        run: python3 media.py cards --date "${{ steps.d.outputs.date }}"

      - name: 스냅샷·리포트 커밋
        run: |
          git config user.name "indie-trending-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "media snapshot ${{ steps.d.outputs.date }}"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push

      - name: Discord 전송 (개인 채널 전용)
        env:
          DISCORD_WEBHOOK_URL_MEDIA: ${{ secrets.DISCORD_WEBHOOK_URL_MEDIA }}
          DISCORD_WEBHOOK_URL_PERSONAL: ${{ secrets.DISCORD_WEBHOOK_URL_PERSONAL }}
        run: python3 media.py send --date "${{ steps.d.outputs.date }}"
